- title: Summary
  type: list
  contents:
    - "Researcher in probability theory, focusing on generalizing results from Gaussian to non-Gaussian settings."
    - "Currently a postdoctoral researcher in Prof. Ciprian Tudor's group (University of Lille), working on Stein method and applications to limit theorems and asymptotic independence."
    - "Previously postdoctoral researcher at the University of Luxembourg with Prof. Ivan Nourdin; developed interest in machine learning through the department's active ML program."

