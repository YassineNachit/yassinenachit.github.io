    preprints:
      - title: "Joint independence from a Gaussian random variable"
        authors:
          - "***Yassine Nachit***"
          - Ciprian Tudor
        journal: "Preprint (2025)"
        summary: |-
          In this preprint, we investigate the relationship between Malliavin calculus and
          independence, focusing on a pair (X, Y) where X is a centered Gaussian random variable
          belonging to the first Wiener chaos and Y is a Malliavin differentiable random variable.
          Our main question is the following: does the vanishing of the Malliavin covariance of
          (X, Y) characterize the independence of the underlying random variables?

          We show that this criterion is indeed true in a large and natural class of situations.
          More precisely, we prove that the equivalence holds whenever Y belongs to a finite sum
          of Wiener chaoses. On the other hand, we show that this phenomenon is genuinely
          restricted to random variables with a finite chaos expansion: the above question may
          fail as soon as Y admits an infinite chaotic expansion.
      - title: "Malliavin smoothness of the Rosenblatt process"
        authors:
          - Laurent Loosveldt
          - "***Yassine Nachit***"
          - Ivan Nourdin
          - Ciprian Tudor
        journal: "Preprint, arXiv:2509.21169 (2025)"
        url: https://arxiv.org/abs/2509.21169
        summary: |-
          This preprint is a continuation of the work on absolute continuity of finite-dimensional
          distributions of Hermite processes, i.e., we continue introducing our new paradigm of
          Malliavin processes as a natural framework that carries out some methods in Gaussian
          processes to a non-Gaussian setting via Malliavin calculus.

          The aim of the present work is to push this further by providing a new approach to
          establish the smoothness of these densities within the same non-Gaussian framework.
          As an example throughout the paper, we focus on the Rosenblatt process, which is a
          non-Gaussian process living in the second Wiener chaos.
      - title: "Absolute continuity of finite-dimensional distributions of Hermite processes via Malliavin calculus"
        authors:
          - Laurent Loosveldt
          - "***Yassine Nachit***"
          - Ivan Nourdin
          - Ciprian Tudor
        journal: "Preprint, arXiv:2511.10299 (2025)"
        url: https://arxiv.org/abs/2511.10299
        summary: |-
          This preprint is one of the most important works in my research: a two-year effort
          initiated during my postdoc at the University of Luxembourg. It develops, in a creative
          way, the first method that generalizes the classical Gaussian approach for proving the
          absolute continuity of finite-dimensional distributions of Gaussian processes (e.g.,
          fractional Brownian motion, corresponding to Hermite processes for q = 1) to a
          non-Gaussian framework (e.g., Hermite processes for q > 1) via Malliavin calculus.

    publications:
      - title: "On the uniform Besov regularity of local times of general processes"
        authors:
          - Brahim Boufoussi
          - "***Yassine Nachit***"
        journal: "Journal of Fractal Geometry (2026)"
        doi: 10.4171/JFG/181
        url: https://doi.org/10.4171/JFG/181
        summary: |-
          The main result is to upgrade the uniform Hölder continuity for local times, in a
          Gaussian and non-Gaussian setting, to a uniform Besov regularity.
      - title: "Quartic variation of the solution to the semilinear stochastic heat equation: limit behavior and asymptotic independence with respect to the data"
        authors:
          - Iulian Cîmpean
          - "***Yassine Nachit***"
          - Ciprian Tudor
        journal: "Journal of Mathematical Analysis and Applications (2025)"
        doi: 10.1016/j.jmaa.2025.130258
        url: https://doi.org/10.1016/j.jmaa.2025.130258
        summary: |-
          This paper represents my first work on Stein method. It concerns using the classical
          Malliavin–Stein method introduced by Ivan Nourdin and Giovanni Peccati to derive the
          limit behavior of the quartic variation (power variation of order four, with respect to
          the time variable) of the solution to the semilinear stochastic heat equation with
          space-time white noise.

          Furthermore, using a recent variant of the Malliavin–Stein method introduced by
          Professor Ciprian Tudor, we analyze the asymptotic independence between the quartic
          variation and the data used to construct it.
      - title: "Besov regularity and local time of the solution to the stochastic heat equation"
        authors:
          - Brahim Boufoussi
          - "***Yassine Nachit***"
        journal: "Stochastics (2023)"
        doi: 10.1080/17442508.2022.2164696
        url: https://doi.org/10.1080/17442508.2022.2164696
        summary: |-
          We investigate the local time of the (Gaussian) linear stochastic heat equation—both in
          space and in time—and improve known sample-path Hölder continuity results to
          Besov-space regularity in each variable.
      - title: "Local times for systems of nonlinear stochastic heat equations"
        authors:
          - Brahim Boufoussi
          - "***Yassine Nachit***"
        journal: "SPDE: Analysis and Computations (2022)"
        doi: 10.1007/s40072-021-00231-9
        url: https://doi.org/10.1007/s40072-021-00231-9
        summary: |-
          This is one of the most important articles of my research: a two-and-a-half-year project
          among the first to extend local time theory from Gaussian to non-Gaussian settings via
          Malliavin calculus, establishing existence, joint continuity, and sharp Sobolev
          regularity for the local time of the (non-Gaussian) solution of the non-linear
          stochastic heat equation.
      - title: "Besov regularity of bifractional Brownian motion"
        authors:
          - Brahim Boufoussi
          - "***Yassine Nachit***"
        journal: "Probability and Mathematical Statistics (2021)"
        doi: 10.37190/0208-4147.41.2.6
        url: https://doi.org/10.37190/0208-4147.41.2.6
        summary: |-
          We generalized the work on the Besov regularity of fractional Brownian motion (with
          stationary increments) to bifractional Brownian motion (which does not have stationary
          increments), improving Hölder continuity results to Besov regularity.

