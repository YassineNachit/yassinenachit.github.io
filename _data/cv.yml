    Summary:
      - >-
        Researcher in probability theory, focusing on generalizing results from Gaussian to
        non-Gaussian settings. Currently a postdoctoral researcher in Prof. Ciprian Tudor’s group
        (University of Lille), working mainly on Stein method and its applications to limit theorems
        and asymptotic independence. Previously a postdoctoral researcher at the University of
        Luxembourg with Prof. Ivan Nourdin; developed strong interest in machine learning through the
        department’s active ML program.

    Research Interests:
      - bullet: (Malliavin) Stein method
      - bullet: Gaussian / non-Gaussian probability theory
      - bullet: Stochastic analysis
      - bullet: Stochastic (partial) differential equations driven by Gaussian / non-Gaussian processes
      - bullet: Malliavin calculus
      - bullet: Sample-path properties
      - bullet: Local times for non-Gaussian processes
      - bullet: Besov regularity of stochastic processes
      - bullet: Gaussian density estimates

