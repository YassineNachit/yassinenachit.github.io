  sections:
    biography:
      - >-
        I am a researcher in probability theory, focusing on generalizing some probability
        aspects from Gaussian to non-Gaussian settings. I am currently a postdoctoral
        researcher in Professor Ciprian Tudor's group at the University of Lille, working
        mainly on developing new tools in Malliavin calculus to investigate densities of
        non-Gaussian processes, Stein method, and local times.

    research_interests:
      - >-
        Gaussian/non-Gaussian probability theory; stochastic analysis; stochastic (partial)
        differential equations driven by Gaussian/non-Gaussian processes; Malliavin calculus;
        (Malliavin) Stein method; sample path properties; local times for Gaussian/non-Gaussian
        processes; Besov regularity of stochastic processes; Gaussian density estimates.

